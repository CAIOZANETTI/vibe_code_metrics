objetivo: 'Proteger o formulário de interação: status "feito" só com prova, gancho
  que confere o formulário e medição da adesão'
criterio_de_pronto:
- vcm rumo --status feito recusa etapa com entregável ausente ou com teste falhando
  no último balanço (com --forcar e motivo registrado)
- gancho Stop instalado pelo vcm iniciar devolve ao agente a resposta que mexeu em
  arquivos sem o formulário completo, sem laço
- vcm sessoes mostra a adesão ao formulário e o custo extra em tokens
- balanço MANTER; merge na main; rumo comentado no PR
