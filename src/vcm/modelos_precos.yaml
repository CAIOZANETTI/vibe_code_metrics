# Catálogo de modelos de IA. Preços: copiados da página oficial, com data e fonte.
# Preços em USD por milhão de tokens (MTok), roteamento global (padrão). Inferência só nos EUA
# (`inference_geo`) multiplica todos os preços por 1,1. Em plano de assinatura, o custo calculado
# com estes preços é "equivalente de API", não o gasto real.
#
# Campos de preco_usd_por_mtok:
#   entrada            tokens de entrada sem cache
#   saida              tokens de saída (inclui raciocínio)
#   cache_leitura      leitura (acerto) de cache, que também renova o cache
#   cache_criacao_5m   escrita no cache de 5 minutos
#   cache_criacao_1h   escrita no cache de 1 hora
# preco_prompt_longo_usd_por_mtok: preços para requisições cujo prompt (entrada + leitura +
#   escrita de cache) passa de limite_prompt_longo_tok. Cada requisição é cobrada por si.
modelos:
