objetivo: 'Execução autônoma: baixar a complexidade do vcm e fazer o vcm sugerir correções
  (sem aplicá-las)'
criterio_de_pronto:
- complexidade média do vcm <= 4,0 e nenhuma função com nota D
- cartão e rumo trazem uma seção 'Correções sugeridas' gerada dos dados, sem alterar
  código
- estimativas calibradas pela razão real/estimado das rodadas anteriores
- balanço sem REVERTER; merge na main; rumo comentado no PR; gasto <= US$ 30
